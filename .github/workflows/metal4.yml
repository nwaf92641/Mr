name: Metal 4 layer

# Compiles graphics/metal4 against the iOS SDK in about a minute.
#
# The same sources are compiled by build/dxmt-ios/build.sh inside the IPA
# pipeline, but only after FEX, GnuTLS, LLVM 15 and Wine have been built --
# roughly three hours in. A wrong MTL4 selector is a one-line fix and should not
# cost a three-hour run to discover, so it is checked here first.
#
# This job proves the layer compiles and archives. It cannot prove Metal 4
# renders: the hosted runners have no GPU reporting MTLGPUFamilyMetal4, and
# graphics/metal4/mr_metal4_milestone.mm is what answers that on a device.

on:
  workflow_dispatch:
  push:
    # Every branch, not just main. A `pull_request` trigger cannot do this job:
    # GitHub only runs pull_request workflows that already exist on the base
    # branch, and main carries no .github/workflows at all -- this file is the
    # only one -- so a PR would never start it. Pushing the branch does.
    branches: ["**"]
    paths:
      - "graphics/metal4/**"
      - "tools/check-metal4.sh"
      - "build/dxmt-ios/build.sh"
      - ".github/workflows/metal4.yml"
  pull_request:
    paths:
      - "graphics/metal4/**"
      - "tools/check-metal4.sh"
      - "build/dxmt-ios/build.sh"
      - ".github/workflows/metal4.yml"

permissions:
  contents: read

concurrency:
  group: metal4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile against the iOS SDK
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      # The winemetal MTL4 bridge compiles against DXMT's own headers, so the
      # submodule has to be present or that source is skipped rather than
      # checked. Depth 1, no recursion.
      - name: Fetch the DXMT submodule
        run: git submodule update --init --depth 1 research/dxmt

      # Printed before the check runs, so a SKIP can be told apart from a pass
      # when reading the log: an image without Xcode 26 has no Metal 4 headers to
      # compile against and the script exits 0.
      - name: Report the toolchain
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no Xcode under /Applications"
          xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "no iphoneos SDK"

      # The real MTL4 signatures, straight out of the SDK headers on the
      # runner, printed on every run rather than only on failure. This is the
      # reference the MTL4 code is written from, and having it in the log means
      # it can be read without a second push.
      - name: Dump the MTL4 SDK surface
        run: tools/check-metal4.sh --dump-surface

      - name: Compile the Metal 4 layer
        run: tools/check-metal4.sh

      - name: Run the Metal 4 milestone harness on this GPU
        run: tools/run-metal4-milestone.sh
