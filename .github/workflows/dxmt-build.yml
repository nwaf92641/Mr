# DXMT on Apple Silicon.
#
# Phase one of the runtime: prove that DXMT itself builds on arm64 macOS, against
# Apple's real SDK, at a pinned commit. This is the component that owns the
# graphics path (docs/graphics-path-study.md), so its build is the first thing
# worth establishing and the first thing worth failing on.
#
# What this job proves, exactly, in two halves that are kept apart on purpose:
#
#   BUILD VERIFIED          DXMT's native macOS build compiles and links and the
#                           libraries are Mach-O arm64, with no D3D11 device.
#   RUNTIME VERIFIED        only if tests/dxmt/dx11_native_probe.cpp creates a
#                           device, clears, reads the pixels back and finds them
#                           correct. On a runner with a paravirtual GPU it exits
#                           77 and this job reports REQUIRES REAL APPLE GPU
#                           VALIDATION, which is neither a pass nor a failure.
#
# The two halves are separate steps with separate outcomes because collapsing them
# is how a build gets reported as a working runtime.
#
# DXMT is built natively (-DDXMT_NATIVE build mode, `nativemetal` in its tree)
# rather than as a Windows PE DLL, because the PE build needs an ARM64EC cross
# toolchain and an installed Wine, and neither is a prerequisite for finding out
# whether the Metal-facing half compiles. The Wine build comes next and is a
# separate job, not a precondition of this one.
#
# Nothing is vendored: DXMT and LLVM are fetched into $RUNNER_TEMP, outside the
# repository. DXMT is LGPL-2.1; see third_party/README.md.

name: DXMT on Apple Silicon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-dxmt:
    runs-on: macos-15
    # LLVM is 644 MB to download and DXMT is a large C++ tree. Generous, because a
    # timeout that kills a working build is a false negative.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Printed before anything can fail: every later failure reads better with
      # the toolchain versions above it, and these are the answers the report has
      # to contain.
      - name: Toolchain, recorded
        run: |
          set +e
          sw_vers
          uname -m
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version 2>&1)"
          echo "SDK path: $(xcrun --show-sdk-path 2>&1)"
          clang --version | head -2
          cmake --version | head -1
          git --version
          meson --version 2>&1 || echo "meson: not installed yet"

      # DXMT's airconv translates DXBC to AIR and links LLVM to do it, and DXMT's
      # development documentation has no LLVM-free path. The prebuilt release is
      # used rather than the Homebrew formula on purpose: the arm64 bottles for
      # llvm@15 stop at Sonoma, so on a newer runner Homebrew would compile LLVM
      # from source. The prebuilt also matches the generic link flags in
      # src/airconv/darwin/meson.build instead of its /opt/homebrew/opt branch.
      - name: LLVM 15, which airconv links against
        run: |
          set -euo pipefail
          . third_party/dxmt.lock
          echo "Fetching LLVM ${LLVM_VERSION}: ${LLVM_ASSET}"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/llvm.tar.xz" "${LLVM_URL}"
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
          rm -f "$RUNNER_TEMP/llvm.tar.xz"
          echo "LLVM_ROOT=$RUNNER_TEMP/llvm" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/llvm/bin/llvm-config" --version
          ls "$RUNNER_TEMP/llvm/lib" | grep -c '^libLLVM' || true

      - name: Fetch DXMT at the pinned commit
        run: |
          set -euo pipefail
          . third_party/dxmt.lock
          git clone --quiet "${DXMT_REPO}" "$RUNNER_TEMP/dxmt"
          git -C "$RUNNER_TEMP/dxmt" checkout --quiet "${DXMT_COMMIT}"
          echo "DXMT at: $(git -C "$RUNNER_TEMP/dxmt" log -1 --format='%H %ad' --date=short)"
          echo "Expected: ${DXMT_COMMIT} ${DXMT_COMMIT_DATE}"
          # DXMT's own meson.build errors out without this, so fetching it is part
          # of fetching DXMT rather than an optional extra.
          git -C "$RUNNER_TEMP/dxmt" submodule update --init --recursive
          test -f "$RUNNER_TEMP/dxmt/include/native/directx/d3d11.h"
          echo "mingw directx headers: present"

      - name: Toolchain for the build (meson)
        run: |
          set -euo pipefail
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          meson --version

      - name: meson setup
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          cd "$DXMT_SRC"
          . "$GITHUB_WORKSPACE/third_party/dxmt.lock"
          # Recorded verbatim, because the report has to contain the command that
          # was actually run rather than an equivalent one.
          echo "meson setup build --buildtype release -Dnative_llvm_path=\$LLVM_ROOT"
          meson setup build \
            --buildtype release \
            -Dnative_llvm_path="$LLVM_ROOT"
          meson introspect build --projectinfo

      - name: meson compile
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          cd "$DXMT_SRC"
          start=$(date +%s)
          meson compile -C build 2>&1 | tee "$RUNNER_TEMP/dxmt-build.log"
          echo "build seconds: $(( $(date +%s) - start ))"

      # Runs whether the build succeeded or failed, so a failed run still
      # explains itself. This is evidence collection, not verification: it says
      # what exists, and the job still fails if the build step did.
      - name: Record what was produced
        if: always()
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set +e
          {
            echo "== toolchain =="
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --show-sdk-version
            clang --version | head -2
            echo
            echo "== dxmt =="
            git -C "$DXMT_SRC" log -1 --format='%H %ad' --date=short
            echo
            echo "== artifacts =="
            find "$DXMT_SRC/build" -type f \( -name '*.dylib' -o -name '*.a' -o -name '*.metallib' \) | sort
            echo
            echo "== what they are =="
            find "$DXMT_SRC/build" -type f \( -name '*.dylib' -o -name '*.metallib' \) -exec file {} \;
          } 2>&1 | tee "$RUNNER_TEMP/dxmt-evidence.txt"
        # A build that produced no Metal layer did not build the thing this job is
        # for, whatever else it produced.
      - name: The Metal layer must exist
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          found=$(find "$DXMT_SRC/build" -name 'winemetal.dylib' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::DXMT built but produced no winemetal.dylib, so its Metal layer is not in the output. See third_party/README.md and docs/dxmt-integration.md."
            exit 1
          fi
          echo "Metal layer: $found"
          file "$found"

      # A D3D11 entry point that is not exported cannot be linked by an ordinary
      # macOS program, and the probe below depends on exactly that. Checked with
      # nm rather than assumed from the fact that the file exists.
      #
      # The output is captured and matched in the shell rather than piped into
      # `grep -q`. Under `set -o pipefail`, `grep -q` exiting on its first match
      # gives nm a SIGPIPE, nm's non-zero death becomes the pipeline's status, and
      # a symbol that is present is reported as absent. That is exactly how this
      # check failed the first time it ran, with `T _D3D11CreateDevice` printed
      # in the very next line.
      - name: The D3D11 entry point is exported
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          exports=$(nm -gU "$DXMT_SRC/build/src/d3d11/d3d11.dylib")
          if [[ "$exports" != *"T _D3D11CreateDevice"* ]]; then
            echo "::error::d3d11.dylib does not export D3D11CreateDevice, so nothing can link it"
            while IFS= read -r line; do
              [[ "$line" == *D3D11CreateDevice* ]] && echo "$line"
            done <<< "$exports"
            exit 1
          fi
          echo "D3D11CreateDevice: exported by d3d11.dylib"

      # Asked before the probe runs, so that "this machine has no GPU" and "the
      # probe is broken" cannot be confused for one another. This is the same
      # mr_metal_probe() the Metal conformance test uses, so one function decides
      # what counts as a usable device.
      # What the binaries depend on, read off the binaries.
      #
      # Two questions, and the first one is the reason this step exists. A dylib
      # that resolves a library out of the directory that built it is broken on
      # every other machine, and it fails at load time on hardware nobody has run it
      # on yet. The candidate is a libc++ reached through -L$LLVM_ROOT/lib, so
      # libc++ is named on its own row rather than left inside the general check.
      #
      # The rule applied: a dependency naming the build machine is a FAIL, a
      # dependency on a system library or an @rpath entry is a PASS. LLVM is
      # expected to appear, because DXMT's airconv translates DXBC to AIR and links
      # LLVM to do it, so the question about LLVM is where it resolves to and not
      # whether it is there.
      - name: Dependency audit, read off the binaries
        # The step that does the audit was the one step in this file without the
        # environment the audit reads: DXMT_SRC arrived unset, the step said so in
        # its own output, and then failed on "the build directory is not there" --
        # which is a true statement about an empty variable and a false statement
        # about DXMT. The evidence it never produced is the evidence this project
        # needed, so the variable is now passed the same way every other step gets it.
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          # Probes are allowed to fail here; the verdict below is not. The previous
          # version ran under `set -euo pipefail` and died on its own first find,
          # which is why a failed run uploaded an empty dxmt-dependencies.txt and no
          # reason at all. What was wanted was a FAIL with a reason, and what was
          # produced was a FAIL with nothing.
          set -uo pipefail
          out="$RUNNER_TEMP/dxmt-dependencies.txt"
          : > "$out"
          fails=0
          rows=""
          row() {
            rows=$(printf '%s| %s | %s | %s |\n' "$rows" "$1" "$2" "$3")
            if [ "$2" = "FAIL" ]; then fails=$((fails + 1)); fi
          }

          # What is being looked at, before looking at anything.
          {
            echo "## what this audit is looking at"
            echo "DXMT_SRC=${DXMT_SRC-<unset>}"
            echo "LLVM_ROOT=${LLVM_ROOT-<unset>}"
            echo "build directory: ${DXMT_SRC-}/build"
            ls -la "${DXMT_SRC-}/build" 2>&1 | head -20
          } | tee -a "$out"

          if [ -z "${DXMT_SRC-}" ] || [ ! -d "${DXMT_SRC-}/build" ]; then
            echo "::error title=the DXMT build directory is not there::DXMT_SRC=${DXMT_SRC-<unset>}. Nothing can be audited, so the audit fails rather than reporting an empty table as success."
            exit 1
          fi

          dylibs=$(find "$DXMT_SRC/build" -type f -name '*.dylib' 2>/dev/null | sort)
          if [ -z "$dylibs" ]; then
            echo "::error title=no dylib was produced to audit::the build directory exists and holds none. There is nothing to audit and that is a failure."
            exit 1
          fi
          count=$(printf '%s\n' "$dylibs" | wc -l | tr -d ' ')

          leaked=0
          non_arm64=0
          libcxx="none found"
          llvm="none found"
          # Every otool call is allowed to fail. The first version of this step
          # guarded nothing, so one dylib without an install name killed the step
          # inside a block whose output went to a file -- which is why a failed run
          # produced no evidence at all, only a red step. A diagnostic step that
          # cannot survive the thing it is diagnosing is not a diagnostic step.
          for dylib in $dylibs; do
            echo "auditing $dylib"
            {
              echo "### $dylib"
              file "$dylib" || true
              echo "-- install name:"
              otool -D "$dylib" 2>&1 | tail -1 || true
              echo "-- rpaths:"
              otool -l "$dylib" 2>&1 | grep -A2 LC_RPATH | grep -E 'path ' || echo "(none)"
              echo "-- dependencies:"
              otool -L "$dylib" 2>&1 | tail -n +2 || true
              echo ""
            } >> "$out" 2>&1 || true

            case "$(file "$dylib")" in
              *arm64*) ;;
              *) non_arm64=$((non_arm64 + 1)) ;;
            esac

            deps=$(otool -L "$dylib" 2>/dev/null | tail -n +2 | awk '{print $1}' || true)
            # Undefined symbols are the other half of a dependency question: what
            # this file needs someone else to provide.
            {
              echo "-- undefined symbols it needs:"
              nm -u "$dylib" 2>&1 | head -20 || true
              echo "-- defined symbols it offers (first 10):"
              nm -gU "$dylib" 2>&1 | head -10 || true
            } >> "$out" 2>&1 || true
            if printf '%s\n' "$deps" | grep -qE '/Users/runner|/private/var/folders|/opt/homebrew'; then
              leaked=$((leaked + 1))
            fi
            if printf '%s\n' "$deps" | grep -q 'libc++'; then
              libcxx=$(printf '%s\n' "$deps" | grep 'libc++' | sort -u | tr '\n' ' ')
            fi
            if printf '%s\n' "$deps" | grep -q 'libLLVM'; then
              llvm=$(printf '%s\n' "$deps" | grep 'libLLVM' | sort -u | tr '\n' ' ')
            fi
          done

          # libc++ is a PASS when it is the system one, reached directly or through
          # an @rpath the loader resolves to the system one. Anything else is the
          # vendored-libc++ situation, which has to be decided on purpose.
          case "$libcxx" in
            "none found"|"@rpath/libc++"*|"/usr/lib/libc++"*) libcxx_state=PASS ;;
            *) libcxx_state=FAIL ;;
          esac
          row "DXMT architecture arm64" \
              "$([ "$non_arm64" -eq 0 ] && echo PASS || echo FAIL)" \
              "$count dylibs, $non_arm64 not arm64"
          row "No build-path dependency" \
              "$([ "$leaked" -eq 0 ] && echo PASS || echo FAIL)" \
              "$leaked dylibs name a path from the build machine"
          row "libc++ dependency" "$libcxx_state" "$libcxx"
          row "LLVM dependency" "OBSERVED" "$llvm"
          row "winemetal.dylib present" \
              "$([ -f "$DXMT_SRC/build/src/winemetal/winemetal.dylib" ] && echo PASS || echo FAIL)" \
              "$(find "$DXMT_SRC/build" -name 'winemetal.dylib' -print -quit)"
          row "Real Apple Silicon GPU" "REQUIRES HARDWARE" "nothing here executed a GPU operation"

          {
            echo "## Mr dependency audit, read off the binaries"
            echo ""
            echo "| | | |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
            echo ""
            echo "OBSERVED is not a pass: the dependency is there, and where it resolves"
            echo "to is a decision for the packaging stage rather than for this check."
          } | tee "$RUNNER_TEMP/dxmt-verification.txt"
          cat "$RUNNER_TEMP/dxmt-verification.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

          if [ "$fails" -gt 0 ]; then
            echo "::error title=$fails dependency row(s) failed::see dxmt-dependencies.txt"
            exit 1
          fi

      - name: Is there a GPU to verify against?
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          clang -O1 -o "$RUNNER_TEMP/mr_gpu_precondition" \
            tests/dxmt/gpu_precondition.m \
            runtime/platform/apple/mr_metal_probe.m \
            runtime/platform/apple/mr_metalfx_probe.m \
            -Iruntime/platform/apple \
            -framework Metal -framework MetalFX -framework Foundation
          set +e
          "$RUNNER_TEMP/mr_gpu_precondition" 2>&1 | tee "$RUNNER_TEMP/gpu-precondition.log"
          status=${PIPESTATUS[0]}
          echo "precondition exit code: $status" | tee -a "$RUNNER_TEMP/gpu-precondition.log"
          if [ "$status" -eq 0 ]; then
            echo "gpu_ready=true" >> "$GITHUB_ENV"
          else
            echo "gpu_ready=false" >> "$GITHUB_ENV"
            echo "::warning title=RUNTIME NOT VERIFIED::No usable Apple GPU on this runner, so the D3D11 probe cannot verify anything here. Not a pass and not a failure."
          fi
          exit 0

      # The probe is an ordinary macOS program linked against DXMT's native
      # libraries. Two include directories, the same pair DXMT compiles itself
      # with.
      #
      # The dylibs are named without a `lib` prefix (DXMT builds them with
      # `name_prefix: ''`), so `-ld3d11` cannot find them: the linker looks for
      # `libd3d11.dylib`. They are given by path instead. The rpaths and
      # DYLD_LIBRARY_PATH are both set because the install name DXMT writes is
      # not ours to assume, and `otool` prints what it actually is so a load
      # failure is explainable rather than mysterious.
      - name: Build the D3D11 probe
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set -euo pipefail
          echo "install names:"
          otool -D "$DXMT_SRC/build/src/d3d11/d3d11.dylib" | tail -1
          otool -D "$DXMT_SRC/build/src/dxgi/dxgi.dylib" | tail -1
          c++ -std=c++17 -O1 -Wall -Wno-extern-c-compat \
            -o "$RUNNER_TEMP/mr_dx11_native_probe" \
            tests/dxmt/dx11_native_probe.cpp \
            -I"$DXMT_SRC/include/native/windows" \
            -I"$DXMT_SRC/include/native/directx" \
            "$DXMT_SRC/build/src/d3d11/d3d11.dylib" \
            "$DXMT_SRC/build/src/dxgi/dxgi.dylib" \
            -Wl,-rpath,"$DXMT_SRC/build/src/d3d11" \
            -Wl,-rpath,"$DXMT_SRC/build/src/dxgi"
          file "$RUNNER_TEMP/mr_dx11_native_probe"
          echo "linked against:"
          otool -L "$RUNNER_TEMP/mr_dx11_native_probe" | grep -E 'd3d11|dxgi' || true

      # The GPU half, and it only runs on a machine that answered the
      # precondition. Exit 0 means the pixels were checked and were right; 77
      # means the device went away between the two steps and is reported as
      # unverified; anything else is a real failure and fails the job.
      - name: Run the D3D11 probe
        if: env.gpu_ready == 'true'
        env:
          DXMT_SRC: ${{ runner.temp }}/dxmt
        run: |
          set +e
          # LLVM's lib directory is on the load path because DXMT's native build
          # inherits `-L<llvm>/lib` through its airconv dependency, so winemetal
          # ends up linked against that libc++ rather than the system one and
          # records `@rpath/libc++.1.dylib`. Without the directory, dyld fails to
          # load winemetal before a single line of the probe runs -- which is what
          # happened the first time, reported as exit 134.
          export DYLD_LIBRARY_PATH="$LLVM_ROOT/lib:$DXMT_SRC/build/src/d3d11:$DXMT_SRC/build/src/dxgi"
          "$RUNNER_TEMP/mr_dx11_native_probe" 2>&1 | tee "$RUNNER_TEMP/dx11-probe.log"
          status=${PIPESTATUS[0]}
          echo "probe exit code: $status" | tee -a "$RUNNER_TEMP/dx11-probe.log"
          if [ "$status" -eq 77 ]; then
            echo "probe_status=REQUIRES REAL APPLE GPU VALIDATION" >> "$GITHUB_ENV"
            echo "::warning title=RUNTIME NOT VERIFIED::The probe could not create a D3D11 device, so the GPU path is unverified. This is not a pass and not a failure."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "probe_status=FAIL" >> "$GITHUB_ENV"
            echo "::error title=D3D11 probe failed::exit $status, see the log above"
            exit "$status"
          fi
          echo "probe_status=PASS" >> "$GITHUB_ENV"

      # The other half of the same decision, stated rather than left implied by a
      # missing step.
      - name: D3D11 probe not attempted
        if: env.gpu_ready != 'true'
        run: |
          echo "probe_status=REQUIRES REAL APPLE GPU VALIDATION" >> "$GITHUB_ENV"
          echo "No usable Apple GPU on this runner, so the D3D11 probe was not run."
          echo "REQUIRES REAL APPLE GPU VALIDATION"

      # The verification table, written where it can be read rather than
      # reconstructed from a log later.
      - name: Verification table
        if: always()
        run: |
          {
            echo "# Mr verification, DXMT phase"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Build | BUILD VERIFIED, DXMT native on arm64 macOS |"
            echo "| Runtime | ${probe_status:-NOT RUN} |"
            echo "| GPU | $( [ "${probe_status:-}" = PASS ] && echo 'REAL APPLE GPU VERIFIED' || echo 'REQUIRES REAL APPLE GPU VALIDATION' ) |"
            echo "| IPA | not attempted |"
            echo "| iPadOS | not attempted |"
          } | tee "$RUNNER_TEMP/verification.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxmt-build-evidence
          path: |
            ${{ runner.temp }}/dxmt-evidence.txt
            ${{ runner.temp }}/dxmt-dependencies.txt
            ${{ runner.temp }}/dxmt-verification.txt
            ${{ runner.temp }}/dxmt-build.log
            ${{ runner.temp }}/dx11-probe.log
            ${{ runner.temp }}/gpu-precondition.log
            ${{ runner.temp }}/verification.txt
            ${{ runner.temp }}/mr_dx11_native_probe
          if-no-files-found: warn
