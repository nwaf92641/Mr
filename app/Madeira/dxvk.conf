# Madeira renderer pre-config (DXVK config syntax).
#
# Madeira runs Windows D3D11 through DXMT (D3D11 -> Metal), not DXVK (D3D11 ->
# Vulkan). DXMT reads the same `key = value` file syntax DXVK does, so this
# file is valid input for both. Keys prefixed `d3d11.` / `dxgi.` / `dxmt.` are
# honoured by the shipped DXMT DLLs; keys prefixed `dxvk.` exist only for a
# DXVK-on-Vulkan path and are ignored (not read, not an error) here.
#
# To use this file on a device: copy it into the app's Documents folder as
# `dxvk.conf` (Files app), then launch. The launch sequence folds it into the
# renderer's config, with the Settings screen's own choices winning on any key
# they also set. The same knobs are available, without a file, under
# Settings -> Compatibility.

# --- Device identity ---------------------------------------------------------
# A title that fingerprints the adapter against a known desktop card may refuse
# to start, pick a software path, or clamp itself on an unrecognised vendor.
# These keys report an NVIDIA GeForce GTX 1070. `10de` is NVIDIA's vendor id;
# `1b81` is the GTX 1070 device id (the GTX 1080 is `1b80`, the GTX 1060
# `1c03`). This is a *claim*, not a fact: the GPU underneath is Apple silicon.
dxgi.customDeviceDesc = "NVIDIA GeForce GTX 1070"
dxgi.customVendorId = 10de
dxgi.customDeviceId = 1b81

# --- DXVK-only knobs (kept for a Vulkan path; inert under DXMT) --------------
# DXMT compiles DXBC -> Metal asynchronously on its own worker pool, so the
# DXVK controls below have no DXMT equivalent to point at. They are included so
# this file also works when the same prefix is used with DXVK on Vulkan.
dxvk.enableAsync = true
dxvk.numCompilerThreads = 0

# --- Memory / stability levers (DXMT reads these; enable by removing `#`) ----
# Clamp the expanded mip chain of block-compressed textures. On GPUs that
# cannot sample BC natively the textures expand 2-8x, and clamping the mips is
# what bounds that cost. On Apple9 (A17 Pro+) hardware BC is sampled natively
# and this only throws detail away.
# d3d11.mipClampBC = True

# Block on D3D11_MAP_FLAG_DO_NOT_WAIT instead of returning
# DXGI_ERROR_WAS_STILL_DRAWING. For a title that passes the flag but does not
# handle the error.
# d3d11.ignoreMapFlagNoWait = True

# Report an SDR display regardless of the panel (DXMT turns this on for one
# title that misbehaves in HDR mode).
# dxgi.forceSDR = True

# Evenly-paced frame cap, paced by Metal rather than a CPU sleep.
# d3d11.preferredMaxFrameRate = 60
